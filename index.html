.scene{
  position:fixed; inset:0; z-index:10; display:none;
  flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:20px; opacity:0; transition:opacity .6s ease;
  overflow-y:auto;
}
.scene.active{display:flex; opacity:1;}
.scene.active .reveal{animation:rise .9s cubic-bezier(.2,.9,.3,1.2) both;}
@keyframes rise{from{transform:translateY(40px) scale(.9); opacity:0;}to{transform:none; opacity:1;}}
h1{font-size:clamp(26px,6vw,52px); line-height:1.4; margin-bottom:8px; text-shadow:0 2px 0 #fff;}
h2{font-size:clamp(20px,5vw,34px); margin-bottom:10px;}
p{font-size:clamp(15px,3.6vw,21px); line-height:1.95; max-width:620px; margin:6px auto;}
.red{color:var(--red);} .sub{color:#a84a7e;}
.photo{
  width:min(88vw,420px); height:auto; object-fit:contain;
  border:none; box-shadow:none;
  margin-bottom:20px; animation:floaty 4s ease-in-out infinite;
}
.photo.sq{width:min(70vw,340px);}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-12px) rotate(1deg)}}
.card{
  background:var(--glass); backdrop-filter:blur(8px); border-radius:26px;
  padding:22px 28px; max-width:640px; border:2px solid #fff;
  box-shadow:0 16px 40px rgba(232,18,63,.2);
}
/* START button (only once) */
.start{
  margin-top:22px; padding:15px 40px; border:none; border-radius:50px; cursor:pointer;
  font-family:inherit; font-weight:800; font-size:20px; color:#fff;
  background:linear-gradient(135deg,var(--red2),var(--purple));
  box-shadow:0 10px 26px rgba(232,18,63,.45); animation:pulse 1.2s infinite;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
/* ===== CAT ===== */
#cat{position:fixed; z-index:90; width:130px; display:none;
  transition:left .9s cubic-bezier(.22,1,.36,1), top .9s cubic-bezier(.22,1,.36,1), transform .4s;
  cursor:pointer; user-select:none; text-align:center;}
#cat.show{display:block; animation:catIn .5s ease;}
@keyframes catIn{from{transform:scale(0)}to{transform:scale(1)}}
#cat img{width:110px; height:110px; border-radius:50%; object-fit:cover;
  border:none; box-shadow:none; background:transparent;}
#cat .bubble{
  background:#fff; color:var(--red); font-weight:800; font-size:15px;
  padding:7px 14px; border-radius:40px; display:inline-block; margin-bottom:6px;
  box-shadow:0 6px 16px rgba(0,0,0,.12); white-space:nowrap; position:relative;
}
#cat .bubble:after{content:""; position:absolute; bottom:-7px; right:28px;
  border:7px solid transparent; border-top-color:#fff; border-bottom:0;}
#cat.wiggle{animation:wig .4s;}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
/* ===== DOLL GAME ===== */
#dollImg{width:min(70vw,280px); height:min(70vw,280px); border-radius:50%; object-fit:cover;
  border:none; box-shadow:none; cursor:pointer; user-select:none;
  position:relative; transition:all .55s cubic-bezier(.34,1.6,.64,1);}
#dollImg.glow{box-shadow:0 0 36px 8px rgba(232,18,63,.7);}
/* ===== LOVE METER ===== */
#loveNum{font-size:clamp(58px,18vw,150px); font-weight:800; color:var(--red); line-height:1;
  text-shadow:0 4px 0 #fff; animation:beat 1s infinite;}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.btn{display:inline-block; margin:10px 8px; padding:14px 32px; border:none; border-radius:50px;
  cursor:pointer; font-family:inherit; font-weight:800; font-size:19px; color:#fff;
  background:linear-gradient(135deg,var(--red2),var(--purple)); box-shadow:0 8px 22px rgba(232,18,63,.4);
  transition:transform .25s;}
.btn:hover{transform:scale(1.06);}
.btn.ghost{background:#fff; color:var(--red);}
.tg{display:inline-flex; align-items:center; gap:10px; background:linear-gradient(135deg,#2aabee,#1f93d1);}
.tg svg{width:24px; height:24px; fill:#fff;}
/* decorative hearts + confetti */
.heart{position:fixed; bottom:-40px; font-size:22px; pointer-events:none; z-index:5;
  animation:float 8s linear infinite; opacity:.8;}
@keyframes float{to{transform:translateY(-120vh) rotate(360deg); opacity:0;}}
.conf{position:fixed; top:-20px; width:9px; height:15px; z-index:70; pointer-events:none;
  border-radius:2px; animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(106vh) rotate(560deg); opacity:.9;}}
/* secret */
#dot{position:absolute; bottom:10px; left:10px; width:28px; height:28px; z-index:45; cursor:pointer;}
#dot::after{content:""; position:absolute; left:50%; top:50%; width:10px; height:10px;
  margin:-5px 0 0 -5px; border-radius:50%; background:rgba(232,18,63,.18);
  animation:tiny 3.6s infinite; transition:transform .25s, background .25s, box-shadow .25s;}
#dot:hover::after{opacity:1; transform:scale(2.3); background:var(--red);
  box-shadow:0 0 14px rgba(232,18,63,.85);}
@keyframes tiny{0%,100%{opacity:.10}50%{opacity:.26}}

/* --- موبایل --- */
@media (max-width: 600px) {
  .photo { width: 92vw; }
  #dollImg { width: 80vw; height: 80vw; }
  #cat { width: 100px; }
  #cat img { width: 90px; height: 90px; }
  #cat .bubble { font-size: 13px; padding: 5px 10px; }
  .card { padding: 16px 18px; }
  h1 { font-size: clamp(22px,7vw,38px); }
  h2 { font-size: clamp(18px,6vw,28px); }
  p { font-size: clamp(14px,4vw,18px); }
  .start { font-size: 17px; padding: 13px 30px; }
  .btn { font-size: 16px; padding: 12px 24px; }
}
</style>
</head>

.scene{
  position:fixed; inset:0; z-index:10; display:none;
  flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:20px; opacity:0; transition:opacity .6s ease;
  overflow-y:auto;
}
.scene.active{display:flex; opacity:1;}
.scene.active .reveal{animation:rise .9s cubic-bezier(.2,.9,.3,1.2) both;}
@keyframes rise{from{transform:translateY(40px) scale(.9); opacity:0;}to{transform:none; opacity:1;}}
h1{font-size:clamp(26px,6vw,52px); line-height:1.4; margin-bottom:8px; text-shadow:0 2px 0 #fff;}
h2{font-size:clamp(20px,5vw,34px); margin-bottom:10px;}
p{font-size:clamp(15px,3.6vw,21px); line-height:1.95; max-width:620px; margin:6px auto;}
.red{color:var(--red);} .sub{color:#a84a7e;}
.photo{
  width:min(88vw,420px); height:auto; object-fit:contain;
  border:none; box-shadow:none;
  margin-bottom:20px; animation:floaty 4s ease-in-out infinite;
}
.photo.sq{width:min(70vw,340px);}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-12px) rotate(1deg)}}
.card{
  background:var(--glass); backdrop-filter:blur(8px); border-radius:26px;
  padding:22px 28px; max-width:640px; border:2px solid #fff;
  box-shadow:0 16px 40px rgba(232,18,63,.2);
}
/* START button (only once) */
.start{
  margin-top:22px; padding:15px 40px; border:none; border-radius:50px; cursor:pointer;
  font-family:inherit; font-weight:800; font-size:20px; color:#fff;
  background:linear-gradient(135deg,var(--red2),var(--purple));
  box-shadow:0 10px 26px rgba(232,18,63,.45); animation:pulse 1.2s infinite;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
/* ===== CAT ===== */
#cat{position:fixed; z-index:90; width:130px; display:none;
  transition:left .9s cubic-bezier(.22,1,.36,1), top .9s cubic-bezier(.22,1,.36,1), transform .4s;
  cursor:pointer; user-select:none; text-align:center;}
#cat.show{display:block; animation:catIn .5s ease;}
@keyframes catIn{from{transform:scale(0)}to{transform:scale(1)}}
#cat img{width:110px; height:110px; border-radius:50%; object-fit:cover;
  border:none; box-shadow:none; background:transparent;}
#cat .bubble{
  background:#fff; color:var(--red); font-weight:800; font-size:15px;
  padding:7px 14px; border-radius:40px; display:inline-block; margin-bottom:6px;
  box-shadow:0 6px 16px rgba(0,0,0,.12); white-space:nowrap; position:relative;
}
#cat .bubble:after{content:""; position:absolute; bottom:-7px; right:28px;
  border:7px solid transparent; border-top-color:#fff; border-bottom:0;}
#cat.wiggle{animation:wig .4s;}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
/* ===== DOLL GAME ===== */
#dollImg{width:min(70vw,280px); height:min(70vw,280px); border-radius:50%; object-fit:cover;
  border:none; box-shadow:none; cursor:pointer; user-select:none;
  position:relative; transition:all .55s cubic-bezier(.34,1.6,.64,1);}
#dollImg.glow{box-shadow:0 0 36px 8px rgba(232,18,63,.7);}
/* ===== LOVE METER ===== */
#loveNum{font-size:clamp(58px,18vw,150px); font-weight:800; color:var(--red); line-height:1;
  text-shadow:0 4px 0 #fff; animation:beat 1s infinite;}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.btn{display:inline-block; margin:10px 8px; padding:14px 32px; border:none; border-radius:50px;
  cursor:pointer; font-family:inherit; font-weight:800; font-size:19px; color:#fff;
  background:linear-gradient(135deg,var(--red2),var(--purple)); box-shadow:0 8px 22px rgba(232,18,63,.4);
  transition:transform .25s;}
.btn:hover{transform:scale(1.06);}
.btn.ghost{background:#fff; color:var(--red);}
.tg{display:inline-flex; align-items:center; gap:10px; background:linear-gradient(135deg,#2aabee,#1f93d1);}
.tg svg{width:24px; height:24px; fill:#fff;}
/* decorative hearts + confetti */
.heart{position:fixed; bottom:-40px; font-size:22px; pointer-events:none; z-index:5;
  animation:float 8s linear infinite; opacity:.8;}
@keyframes float{to{transform:translateY(-120vh) rotate(360deg); opacity:0;}}
.conf{position:fixed; top:-20px; width:9px; height:15px; z-index:70; pointer-events:none;
  border-radius:2px; animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(106vh) rotate(560deg); opacity:.9;}}
/* secret */
#dot{position:absolute; bottom:10px; left:10px; width:28px; height:28px; z-index:45; cursor:pointer;}
#dot::after{content:""; position:absolute; left:50%; top:50%; width:10px; height:10px;
  margin:-5px 0 0 -5px; border-radius:50%; background:rgba(232,18,63,.18);
  animation:tiny 3.6s infinite; transition:transform .25s, background .25s, box-shadow .25s;}
#dot:hover::after{opacity:1; transform:scale(2.3); background:var(--red);
  box-shadow:0 0 14px rgba(232,18,63,.85);}
@keyframes tiny{0%,100%{opacity:.10}50%{opacity:.26}}

/* --- موبایل --- */
@media (max-width: 600px) {
  .photo { width: 92vw; }
  #dollImg { width: 80vw; height: 80vw; }
  #cat { width: 100px; }
  #cat img { width: 90px; height: 90px; }
  #cat .bubble { font-size: 13px; padding: 5px 10px; }
  .card { padding: 16px 18px; }
  h1 { font-size: clamp(22px,7vw,38px); }
  h2 { font-size: clamp(18px,6vw,28px); }
  p { font-size: clamp(14px,4vw,18px); }
  .start { font-size: 17px; padding: 13px 30px; }
  .btn { font-size: 16px; padding: 12px 24px; }
}
</style>
</head>

<section class="scene active" id="s-intro">
  <div class="reveal card">
    <h1>🎀 روز دخترت مبارک 🎀</h1>
    <p>یه دنیا سورپرایز برات ساختم… آماده‌ای؟</p>
  </div>
  <button class="start" onclick="startJourney()">شروع کنیم 💝</button>

  <div id="dot" title="؟" onclick="openSecret()"></div>
